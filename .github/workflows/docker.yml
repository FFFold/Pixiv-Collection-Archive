name: Docker

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Smoke test the amd64 image: startup, SPA shell, health endpoint and
      # the bundled frontend assets, using a throwaway data volume.
      - name: Smoke test image
        run: |
          set -euo pipefail
          IMAGE=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)
          docker run -d --name smoke \
            -p 18000:8000 \
            -e PIXIV_REFRESH_TOKEN=dummy \
            -e PIXIV_USER_ID=1 \
            -e AUTH_TOKEN=smoke-token \
            -e DATA_DIR=/tmp/data \
            "$IMAGE"
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18000/api/health >/dev/null 2>&1; then break; fi
            sleep 2
          done
          echo "--- health ---"
          curl -fsS http://127.0.0.1:18000/api/health
          echo
          echo "--- SPA shell ---"
          curl -fsS http://127.0.0.1:18000/ | head -n 5
          echo "--- login ---"
          curl -fsS -c /tmp/cookies.txt -X POST http://127.0.0.1:18000/api/auth/login \
            -H 'content-type: application/json' -d '{"token":"smoke-token"}'
          echo
          echo "--- gallery (empty library) ---"
          curl -fsS -b /tmp/cookies.txt "http://127.0.0.1:18000/api/gallery?limit=1"
          echo
          echo "--- container logs ---"
          docker logs smoke --tail 20

      - name: Stop smoke container
        if: always()
        run: docker rm -f smoke || true
